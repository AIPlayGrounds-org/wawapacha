quote = "The 0.05° grid spacing of the daily products therefore should not be interpreted as indicating that the ERA5 or IMERG data used for temporal disaggregation contain information at 0.05° resolution."

[[claim]]
id = "icen-plain-definition"
claim_es = "El ICEN es el promedio de tres meses de cuánto se aparta de lo normal la temperatura de la superficie del mar en la región Niño 1+2."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/nota-tecnica-enfen-01-2024-definicion-operacional-de-los-eventos-el-nino-costero-y-la-nina-costera-en-el-peru/"
locator = "Nota Técnica ENFEN 01-2024, PDF p. 1, section 2 \"Índice Costero El Niño (ICEN)\", first sentence"
quote = "Consiste en la media corrida de tres meses de las anomalías mensuales de la temperatura superficial del mar (TSM) en la región Niño 1+2."

[[claim]]
id = "nino-1-2-box"
claim_es = "La región Niño 1+2 es una caja de mar entre 0° y 10° de latitud sur y entre 90° y 80° de longitud oeste."
