claim_es = "Los Niños extremos forman su propio régimen, visto en 1982-83 y 1997-98, y en menor grado en 1877-78; por eso se puede decir poco de ellos a partir de observaciones."
status = "verified"
date_checked = "2026-11-25"

[[claim.source]]
ref = "https://hal.science/hal-00994266v1/document"
locator = "Takahashi, Montecinos, Goubanova & Dewitte, \"ENSO regimes: Reinterpreting the canonical and Modoki El Niño\", Geophys. Res. Lett. 38, L10704, 2011, HAL copy, PDF p. 5, section 4"
quote = "The regime of extreme warm events is illustrated in nature by the 1982–83 and 1997–98 events and, to a lesser extent, by the 1877–78 event."

[[claim.source]]
ref = "https://hal.science/hal-00994266v1/document"
locator = "Takahashi, Montecinos, Goubanova & Dewitte, \"ENSO regimes: Reinterpreting the canonical and Modoki El Niño\", Geophys. Res. Lett. 38, L10704, 2011, HAL copy, PDF p. 2, abstract"
quote = "little can be said observationally with respect to the extreme warm regime."

