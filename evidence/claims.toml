[[claim]]
id = "glantz-2000-peru-lesson"
claim_es = "El ciclo de El Niño debe planificarse como un hecho recurrente, en defensa civil, zonificación y normas de construcción, no como una anomalía pasajera."
status = "verified"
date_checked = "2026-11-25"

[[claim.source]]
ref = "https://sigrid.cenepred.gob.pe/sigridv3/documento/1128/descargar"
locator = "Glantz (ed.), \"Lessons Learned from the 1997–98 El Niño: Once Burned, Twice Shy?\", UNEP/NCAR/UNU/WMO/ISDR, October 2000, PDF p. 26, lessons for Peru"
quote = "The ENSO cycle must be considered by policy makers as a recurrent event in national planning (civil defense, urban zoning, construction codes) rather than as an anomalous and temporary condition."
outlet = "PNUMA"
published = "2000-10"
lift = "The ENSO cycle must be considered by policy makers as a recurrent event in national planning"
