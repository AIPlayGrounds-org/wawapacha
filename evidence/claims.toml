[[claim]]
id = "garreaud-2018-unpredicted"
claim_es = "El Niño costero de 2017 casi no se pronosticó: en diciembre de 2016 los centros climáticos, ENFEN incluido, esperaban condiciones casi neutras."
status = "verified"
date_checked = "2026-11-25"

[[claim.source]]
ref = "https://web.archive.org/web/20260128101421id_/https://repositorio.uchile.cl/bitstream/handle/2250/152026/A-plausible-atmospheric-trigger-for-the-2017-coastal-El-Nino.pdf"
locator = "Garreaud, \"A plausible atmospheric trigger for the 2017 coastal El Niño\", Int. J. Climatol. 38 (Suppl. 1), 2018, printed p. e1296 (PDF p. 1), abstract"
quote = "This strong coastal El Niño was largely unpredicted, even a few weeks before its onset"

[[claim.source]]
ref = "https://web.archive.org/web/20260128101421id_/https://repositorio.uchile.cl/bitstream/handle/2250/152026/A-plausible-atmospheric-trigger-for-the-2017-coastal-El-Nino.pdf"
locator = "Garreaud, \"A plausible atmospheric trigger for the 2017 coastal El Niño\", Int. J. Climatol. 38 (Suppl. 1), 2018, printed p. e1296 (PDF p. 1), Introduction"
quote = "by December 2016 many operational climate centres anticipated near-neutral conditions for the next quarter over the central (IRI; CPC-USA) and eastern Pacific (ERFEN Ecuador; ENFEN Peru). Then came January 2017"

[[claim]]
