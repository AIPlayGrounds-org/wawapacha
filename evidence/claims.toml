[[claim]]
id = "forecast-uncertainty-plain"
claim_es = "Las alertas de ENFEN se basan en pronósticos probabilísticos, con incertidumbre, y se actualizan con nuevas observaciones y con las predicciones de los modelos."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://enfen.imarpe.gob.pe/download/nota-tecnica-enfen-02-2026-sistema-de-alerta-ante-el-nino-costero-y-la-nina-costera/"
locator = "Nota Técnica ENFEN 02-2026, PDF p. 2, \"Consideraciones\", fourth paragraph"
quote = "En los CO se explicará claramente que estos estados de alerta se sustentan en pronósticos de naturaleza probabilística, con niveles de incertidumbre. Por lo tanto, dichos estados serán actualizados de acuerdo al análisis de las observaciones oceánicas y atmosféricas, así como de las predicciones de los modelos climáticos."

[[claim]]
id = "icen-revises-plain"
claim_es = "El último ICEN se calcula con un dato en tiempo real que cambia al mes siguiente, por eso los valores recientes pueden variar un poco."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://repositorio.igp.gob.pe/bitstreams/b7560525-c705-4ad7-a423-9d897ca7e5bb/download"
locator = "Informe Técnico IGP N° PpR/El Niño-IGP/2026-07 (14/08/2026), PDF p. 2, section \"Índice Costero El Niño (ICEN) y el ICEN relativo\", first paragraph"
quote = "Cabe señalar que para el cálculo del último ICEN se utiliza la última información del archivo de ERSSTv5 publicada en la web, cuyo último valor (“dato en tiempo real”) siempre cambiará en el siguiente mes. Por este motivo, existirán pequeñas discrepancias en el valor del ICEN para los meses anteriores cuando se use la data actualizada."

