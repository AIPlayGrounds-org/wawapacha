claim_es = "Un Niño costero como el de 2017 solo se había visto en 1891 y 1925, y el de 2017 fue el más extremo."
status = "verified"
date_checked = "2026-11-25"

[[claim.source]]
ref = "https://web.archive.org/web/20260128101421id_/https://repositorio.uchile.cl/bitstream/handle/2250/152026/A-plausible-atmospheric-trigger-for-the-2017-coastal-El-Nino.pdf"
locator = "Garreaud, \"A plausible atmospheric trigger for the 2017 coastal El Niño\", Int. J. Climatol. 38 (Suppl. 1), 2018, printed p. e1297 (PDF p. 2), section 2"
quote = "have occurred previously only in 1891 and 1925 (Takahashi and Martínez, 2017), with the 2017 case being the most extreme"

[[claim]]
id = "garreaud-2018-piura"
claim_es = "En 2017 llovieron más de 700 mm en San Miguel (Piura), unas 15 veces lo normal, como solo en 1983 y 1998; el río Piura, casi seco en 2016, pasó de 700 m³/s a mediados de febrero."
status = "verified"
date_checked = "2026-11-25"

[[claim.source]]
ref = "https://web.archive.org/web/20260128101421id_/https://repositorio.uchile.cl/bitstream/handle/2250/152026/A-plausible-atmospheric-trigger-for-the-2017-coastal-El-Nino.pdf"
locator = "Garreaud, \"A plausible atmospheric trigger for the 2017 coastal El Niño\", Int. J. Climatol. 38 (Suppl. 1), 2018, printed p. e1298 (PDF p. 3), section 2"
quote = "Between January and April the rainfall accumulated at San Miguel station exceeded 700 mm, about 15-times larger than the long-term mean accumulation, only comparable to the values observed in the summer of 1983 and 1998"

[[claim.source]]
ref = "https://web.archive.org/web/20260128101421id_/https://repositorio.uchile.cl/bitstream/handle/2250/152026/A-plausible-atmospheric-trigger-for-the-2017-coastal-El-Nino.pdf"
locator = "Garreaud, \"A plausible atmospheric trigger for the 2017 coastal El Niño\", Int. J. Climatol. 38 (Suppl. 1), 2018, printed p. e1298 (PDF p. 3), section 2"
quote = "the Piura river was virtually dry for most of the austral winter and spring 2016 but its flow suddenly increased around the third week of January 2017 and by mid February it exceeded 700 m3 s−1 (∼seven times the long-term mean) for most days"

