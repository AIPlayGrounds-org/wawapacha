[[claim]]
id = "chirps-pentad-6-days"
claim_es = "En CHIRPS cada mes tiene seis pentadas: las cinco primeras tienen cinco días y la sexta, de entre 3 y 6 días, cierra el mes. CHC añade que los productos diarios rnl y sat suman el mismo total pentadal de CHIRPS3."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://earlywarning.usgs.gov/fews/product/190/"
locator = "FEWS NET, CHIRPS Pentadal Rainfall, Documentation, entry \"pentadal\""
quote = "The first 5 pentads of each month have 5 days. The last pentad, or 6th pentad, of each month can have as few as 3 days (for example, Feb with 28 days in non-leap years) and as many as 6 days (Jan, Mar, May, Jul, Aug, Oct, Dec, with 31 days)."

[[claim.source]]
ref = "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/readme.txt"
locator = "CHC, Information about CHIRPS Daily Precipitation, section \"Daily disaggregation\", item i"
quote = "rnl and sat sum to the same CHIRPS3 pentadal precipitation total"

[[claim]]
id = "chirps-preliminary-provisional"
claim_es = "FEWS NET considera provisionales los datos preliminares de CHIRPS hasta que se incorporan todas las estaciones, unos 20 días después del fin del mes; el producto final se publica una vez al mes."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://earlywarning.usgs.gov/fews/product/190/"
locator = "FEWS NET, CHIRPS Pentadal Rainfall, Disclaimer at the top of the page"
quote = "Due to the limited number of station inputs, the preliminary (prelim) CHIRPS data are considered provisional until that time when the full complement of station inputs can be incorporated (approximately 20 days after the end of the month)."

