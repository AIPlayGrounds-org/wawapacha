[[claim]]
id = "senamhi-2015-south-basins-1983-1998"
claim_es = "El análisis SPI-3 de SENAMHI (2015) de las tres regiones hidrográficas más al sur de la vertiente del Pacífico (Pacífico 1, 2 y 3, cuencas completas, también andinas) muestra déficit de lluvia en marzo de 1983 sobre el 61 %, 87 % y 54 % de la superficie de cada región, y ningún déficit en marzo de 1998, cuando el territorio estuvo normal (Pacífico 1: 88 %) o con excesos (Pacífico 3: 100 %). Los porcentajes son de superficie, no de lluvia."
status = "held"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://sigrid.cenepred.gob.pe/sigridv3/documento/1903/descargar"
locator = "SENAMHI, Distribución espacial de la precipitación en el Perú durante Eventos Niño 1982-83 y 1997-98 (2015), PDF p. 7 (printed p. 4), section 5.1.1 Región Pacífico 1, item b"
quote = "Según el SPI-3 evaluado en marzo de 1983, que acumula las lluvias del trimestre EFM, se tiene que el 61% de la superficie de esta región estuvo afectada por déficit pluviométrico; el 24% tuvo un comportamiento normal y el 16% fue afectada por excesos."

[[claim.source]]
ref = "https://sigrid.cenepred.gob.pe/sigridv3/documento/1903/descargar"
locator = "same document, PDF p. 8, section 5.1.1 Región Pacífico 1, item d"
quote = "Según el SPI-3 evaluado en marzo de 1998, que acumula las lluvias del trimestre EFM, no existe afectación por sequía; el 88% del territorio tuvo un comportamiento normal y el 12% fue afectada por excesos."

[[claim.source]]
ref = "https://sigrid.cenepred.gob.pe/sigridv3/documento/1903/descargar"
locator = "same document, PDF p. 8, section 5.1.2 Región Pacífico 2, item b"
quote = "Según el SPI-3 evaluado en marzo de 1983, que acumula las lluvias del trimestre EFM, se tiene que el 87% de la superficie de esta región estuvo afectada por déficit pluviométrico; el 12% tuvo un comportamiento normal y no existe afectación por excesos."

[[claim.source]]
ref = "https://sigrid.cenepred.gob.pe/sigridv3/documento/1903/descargar"
locator = "same document, PDF p. 9, section 5.1.3 Región Pacífico 3, item b"
quote = "Según el SPI-3 evaluado en marzo de 1983, que acumula las lluvias del trimestre EFM, se tiene que el 54% de la superficie de esta región estuvo afectada por déficit pluviométrico; el 44% tuvo un comportamiento normal y el 3% fue afectada por excesos."

[[claim.source]]
ref = "https://sigrid.cenepred.gob.pe/sigridv3/documento/1903/descargar"
locator = "same document, PDF p. 9, section 5.1.3 Región Pacífico 3, item d"
quote = "Según el SPI-3 evaluado en marzo de 1998, que acumula las lluvias del trimestre EFM, no existe afectación por sequía; no existe un comportamiento normal y el 100% fue afectada por excesos."

[[claim.source]]
ref = "https://sigrid.cenepred.gob.pe/sigridv3/documento/1903/descargar"
locator = "same document, PDF p. 7, section 5.1.1, opening sentence naming the basins of Región Pacífico 1"
quote = "A esta región pertenecen las cuencas Tambo, Moquegua, Locumba, Sama, Caplina y Hospicio."

