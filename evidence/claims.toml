claim_es = "En julio de 1997, el IGP esperaba un Niño lluvioso pero «lejos» de los niveles desastrosos de 1983, porque en 450 años de historia de Piura no hubo otro igual."
status = "verified"
date_checked = "2026-11-25"

[[claim.source]]
ref = "https://repositorio.igp.gob.pe/bitstreams/0f44f604-6777-4978-9d0a-d97a42f45d53/download"
locator = "Woodman, \"El Niño 1997-1998: situación reciente y futura\", IGP, 5 July 1997, PDF p. 4, section on the forecast; a scan, quote transcribed from the page image"
quote = "Esta inexactitud, combinados con la baja probabilidad de que se presente nuevamente un fenómeno tan intenso y tan poco frecuente como el de 1982-83, nos hace ser optimistas para la época de verano y esperar como caso extremo un Niño lluvioso como el predicho, sobre todo al inicio del verano, pero lejos de tener los niveles desastrosos que se presentaron en 1983. Hay que tener presente que no encontramos en los 450 años de historia de Piura un Niño con intensidad comparable a la de 1983"
outlet = "IGP"
published = "1997-07-05"
lift = "lejos de tener los niveles desastrosos que se presentaron en 1983"

