claim_es = "SENAMHI describe PISCO v2.2 como un producto grillado de acumulados mensuales de precipitación a 0,1° (unos 10 km), con cobertura temporal desde enero de 1981 y cobertura espacial del territorio peruano. No son series de estaciones."
