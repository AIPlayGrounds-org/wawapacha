[[claim]]
id = "chirps-daily-grid-not-finer"
claim_es = "La malla de 0,05° de los productos diarios de CHIRPS3 no indica que los datos de ERA5 o IMERG usados para la desagregación temporal contengan información a esa resolución."
status = "verified"
date_checked = "2026-10-10"

[[claim.source]]
ref = "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/readme.txt"
